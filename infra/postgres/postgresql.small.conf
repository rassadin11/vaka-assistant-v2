# PostgreSQL settings for the small deployment profile (plan/small-profile.md S8).
#
# The container runs with mem_limit 256m, so every number here is a share of
# that ceiling rather than a fraction of the host: exceeding it means the cgroup
# OOM-killer takes postgres down, not that the box starts swapping.
#
# WAL archiving is off on purpose (section 4.6). The prod image ships pgbackrest
# and the prod config archives into it; leaving archive_mode on without a
# running pgbackrest would make postgres retry a failing archive_command
# forever and keep every WAL segment on disk until the volume fills. Backups in
# this profile are pg_dump (S11).

listen_addresses = '*'

# Memory. shared_buffers matches the budget table in section 2 of the plan:
# 96MB of a 256MB ceiling leaves room for backends, autovacuum and the OS page
# cache the planner assumes below.
shared_buffers = 96MB
effective_cache_size = 512MB
work_mem = 4MB
maintenance_work_mem = 64MB

# Connections. PgBouncer is gone in this profile (section 3): asyncpg pools
# connect straight to postgres, so this ceiling is the real one. One worker with
# an app pool and a service pool plus psql sessions for operations fit well
# inside 20; each idle backend costs a few MB, which is why it is not larger.
max_connections = 20

# Write path. A small VPS disk is the slow part, so keep the WAL small and
# checkpoints spread out rather than bursty.
wal_level = replica
archive_mode = off
max_wal_size = 512MB
min_wal_size = 128MB
checkpoint_completion_target = 0.9

# Autovacuum has to keep up on its own here -- nobody is watching bloat on a
# 5-10 person install, and the tables that churn (queue-adjacent counters,
# messages) are small enough that more frequent, cheaper passes are free.
autovacuum = on
autovacuum_naptime = 30s
autovacuum_vacuum_scale_factor = 0.1
autovacuum_analyze_scale_factor = 0.05

# Logging. docker compose logs is the whole observability stack in this profile
# (section 4.5), so log what an operator would otherwise learn from Grafana.
log_min_duration_statement = 1000
log_checkpoints = on
log_connections = off
log_disconnections = off
log_lock_waits = on
log_temp_files = 0
log_line_prefix = '%m [%p] %q%u@%d '

# Planner. A small VPS is on SSD/NVMe, so random access is not four times the
# cost of sequential; the default makes the planner avoid index scans it should
# be taking.
random_page_cost = 1.1
effective_io_concurrency = 200

timezone = 'UTC'
