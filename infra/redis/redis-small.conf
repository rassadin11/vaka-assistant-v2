# Single Redis instance for the small deployment profile (plan/small-profile.md 4.3).
#
# The prod profile runs two instances because their eviction policies conflict:
# the queue must never lose data (noeviction) while the cache may (allkeys-lru).
# Merging them is only correct in one direction -- noeviction for everything --
# because allkeys-lru would evict queue entries. That makes every cache key
# without a TTL a slow leak that eventually answers writes with
# "OOM command not allowed", which stops the queue; the audit in S7 removed the
# ones that existed and the rule is now that every key carries an expiry.
bind 0.0.0.0
port 6379
dir /data

appendonly yes
appendfsync everysec
save 3600 1

maxmemory 64mb
maxmemory-policy noeviction
